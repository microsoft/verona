name: Verona BC CI

# The following should ensure that the workflow only runs a single set of actions
# for each PR. But it will not apply this to pushes to the main branch.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        # Variant is used to specify alternative jobs by specifying somethig other then
        # standard
        variant: [ "Standard" ]

        platform: [ "ubuntu-latest", "ubuntu-24.04-arm", "macos-latest" ]


        build-type: [ "Release", "Debug" ]
                
        include:
          - platform: "ubuntu-latest"
            cmake-flags: "-G Ninja"
            dependencies: "sudo apt update && sudo apt install ninja-build libzstd-dev libffi-dev libgit2-dev"

          - platform: "ubuntu-24.04-arm"
            cmake-flags: "-G Ninja"
            dependencies: "sudo apt update && sudo apt install ninja-build libzstd-dev libffi-dev libgit2-dev"

          - platform: "macos-latest"
            cmake-flags: "-G Ninja"
            dependencies: |
              brew install ninja libffi libgit2 zstd openssl pkg-config
              echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix zstd)/lib/pkgconfig:$(brew --prefix libgit2)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
              echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV

          - variant: "Clang"
            platform: "ubuntu-latest"
            build-type: "Release"
            cmake-flags: "-G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
            dependencies: "sudo apt update && sudo apt install ninja-build libzstd-dev libffi-dev libgit2-dev"

          - variant: "Sanitizer"
            platform: "ubuntu-latest"
            build-type: "Release"
            cmake-flags: "-G Ninja -DSANITIZER=address,undefined -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
            dependencies: "sudo apt update && sudo apt install ninja-build libzstd-dev libffi-dev libgit2-dev"

          - variant: "Sanitizer"
            platform: "ubuntu-24.04-arm"
            build-type: "Release"
            cmake-flags: "-G Ninja -DSANITIZER=address,undefined -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
            dependencies: "sudo apt update && sudo apt install ninja-build libzstd-dev libffi-dev libgit2-dev"
      # Don't abort runners if a single one fails
      fail-fast: false
    runs-on: ${{matrix.platform}}

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: ${{ matrix.dependencies }}
    
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DVERONA_CI_BUILD=On ${{matrix.cmake-flags}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build-type}} --parallel 4

    - name: Install
      run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}}

    - name: Test
      working-directory: ${{github.workspace}}/build/
      run: ctest -C ${{matrix.build-type}} -j 4 ${{matrix.ctest-flags}} --output-on-failure --timeout 400 --interactive-debug-mode 0 

  # Job to run clang-format and report errors
  format:
    runs-on: "ubuntu-latest"
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install clang-format-20 libzstd-dev libffi-dev libgit2-dev

    # Configure the project-owned formatting target without building the compiler.
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build

    - name: Check Verona formatting
      run: |
        clang-format-20 --version
        cmake --build ${{github.workspace}}/build --target verona-clangformat-check

  all-checks:
    needs: [ build-test, format ]
    runs-on: "ubuntu-latest"
    steps:
    - name: Dummy step
      run: true
